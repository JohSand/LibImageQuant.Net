name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native library (linux-x64)
        if: runner.os == 'Linux'
        run: bash native/build.sh

      - name: Build native library (win-x64)
        if: runner.os == 'Windows'
        run: pwsh native/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/runtimes/${{ matrix.rid }}/native
          if-no-files-found: error

  pack:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/runtimes/linux-x64/native

      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: native/runtimes/win-x64/native

      - name: Compute version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: dotnet pack
        run: >
          dotnet pack LibImageQuant.Net.sln -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Requires a "nuget-publish" environment configured in repo settings
    # (Settings > Environments), holding the NUGET_API_KEY secret and,
    # recommended, a required-reviewer protection rule as a manual gate
    # before anything is pushed to nuget.org.
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: dotnet nuget push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
