name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # libimagequant v4+ needs cargo-c (https://github.com/lu-zero/cargo-c) to build its
      # C-ABI shared library. GitHub-hosted runners ship Rust/Cargo already; this just adds
      # the prebuilt cargo-c binaries to it, rather than compiling cargo-c from source on
      # every run.
      - name: Install cargo-c (linux-x64)
        if: runner.os == 'Linux'
        run: curl -sL https://github.com/lu-zero/cargo-c/releases/download/v0.10.24/cargo-c-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin

      - name: Install cargo-c (win-x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/lu-zero/cargo-c/releases/download/v0.10.24/cargo-c-windows-msvc.zip" -OutFile cargo-c.zip
          Expand-Archive -Path cargo-c.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force

      - name: Build native library (linux-x64)
        if: runner.os == 'Linux'
        run: bash native/build.sh

      - name: Build native library (win-x64)
        if: runner.os == 'Windows'
        run: pwsh native/build.ps1

      - name: dotnet build
        run: dotnet build LibImageQuant.Net.sln

      # The Visual-category snapshot tests do an exact byte comparison against a checked-in
      # PNG; libimagequant's multi-threaded quantization is deterministic on a given machine,
      # but its work-stealing order isn't guaranteed to produce byte-identical floating-point
      # accumulation across different OSes/CPU core counts. Only run them on linux-x64 to
      # avoid a spurious cross-platform diff.
      - name: dotnet test
        if: runner.os == 'Linux'
        run: dotnet test LibImageQuant.Net.sln

      - name: dotnet test (excluding visual snapshot tests)
        if: runner.os == 'Windows'
        run: dotnet test LibImageQuant.Net.sln --filter "Category!=Visual"
